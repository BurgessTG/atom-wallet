plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'dev.burgesstg.mdwa'
    compileSdk 35
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId 'dev.burgesstg.mdwa'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    androidResources { noCompress += ['pck', 'wasm'] }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/proverLibs')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/walletAssets')
}
dependencies {
    implementation 'org.godotengine:godot:4.7.2.stable'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

def walletAssets = tasks.register('walletAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build-android-assets.mjs'
    inputs.files fileTree('../../extension'), fileTree('../../wallet'), fileTree('../worker'),
        fileTree('../ui') { exclude '.godot/**' }, fileTree('../../scripts') { include '*.mjs' },
        file('../../package-lock.json')
    outputs.dir layout.buildDirectory.dir('generated/walletAssets')
}
tasks.named('preBuild').configure { dependsOn walletAssets }

def nativeProver = tasks.register('nativeProver', Exec) {
    def proverDir = rootProject.file('prover')
    def destination = layout.buildDirectory.dir('generated/proverLibs').get().asFile
    workingDir proverDir
    commandLine 'python3', 'build-android.py', android.ndkDirectory.absolutePath, destination.absolutePath
    inputs.files fileTree(proverDir) { exclude 'target/**', '.upstream/**', 'gpu/target/**' }
    outputs.dir destination
}
tasks.named('preBuild').configure { dependsOn nativeProver }
